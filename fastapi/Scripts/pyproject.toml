[project]
name = "stock-sense"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi[standard]==0.136.1",
    "pandas==3.0.2",
    "numpy==2.4.4",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "yfinance==1.2.0",
    "ta==0.11.0",
    "nse==2.1.3",
    "nsepython==2.97",
    "python-dotenv==1.2.2",
    "supabase==2.30.0",
    "requests==2.33.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.fastapi]
entrypoint = "stocks.main:app"
